user:
  cycle_frequency: 24

platform:
  account: rtgsd-fv3-dev
get_ics_data:
  execution:
    walltime: 00:05:00
prepare_grib_ics:
  ungrib:
    execution:
      batchargs:
        walltime: 00:05:00
mpas_ics:
  execution:
    batchargs:
      walltime:

workflow:
  attrs:
    realtime: true
    cyclethrottle: 3
  entities:
    LOGDIR: "{{user.experiment_dir}}/log/@Y@m@d@H"
  tasks:
    task_get_ics_data:
      attrs:
        maxtries: 3
      account: gsd-fv3-dev
      dependency:
        timedep:
          cyclestr:
            attrs:
              offset: 04:45:00
            value: "@Y@m@d@H@M@S"
    task_ungrib_ics:
      attrs:
        maxtries: 3
      native:
        cyclestr:
          value: --reservation=gsd_prep_@H
    task_mpas_ics:
      attrs:
        maxtries: 3
      native:
        cyclestr:
          value: --reservation=gsd_ini_@H
    task_mpas:
      native:
        cyclestr:
          value: --reservation=gsd_fcst_@H
    metatask_post:
      task_mpassit_#fhr#:
        attrs:
          maxtries: 3
        # native:
        #   cyclestr:
        #     value: --reservation=gsd_post1_@H
        account: gsd-fv3-dev
      task_upp_#fhr#:
        attrs:
          maxtries: 3
        # native:
        #   cyclestr:
        #     value: --reservation=gsd_post1_@H
        account: gsd-fv3-dev
      task_combine_grib_#fhr#:
        attrs:
          maxtries: 3
        # native:
        #   cyclestr:
        #     value: --reservation=gsd_post1_@H
        account: gsd-fv3-dev
    task_tracker:
        attrs:
          maxtries: 3
        # native:
        #   cyclestr:
        #     value: --reservation=gsd_post1_@H
        account: gsd-fv3-dev
    task_graphics:
      # native:
      #   cyclestr:
      #     value: --reservation=gsd_post2_@H
      attrs:
        maxtries: 3
      account: gsd-fv3-dev


